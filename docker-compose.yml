version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: finance-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - finance-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: finance-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/finance_tracker
      - JWT_SECRET=super_secret_finance_tracker_key_123456
      - JWT_REFRESH_SECRET=super_secret_refresh_key_987654
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - finance-network

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: finance-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - finance-network

volumes:
  mongo_data:

networks:
  finance-network:
    driver: bridge
